name: picking
description: Thin app shell. Entry point, route table, screens, wiring.
publish_to: none
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../../packages/core
  components:
    path: ../../packages/components
  # No other app here. Apps depend on core and components only.
  flutter_riverpod: ^3.4.3
  get_it: ^9.2.1
  go_router: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/inventory.json
